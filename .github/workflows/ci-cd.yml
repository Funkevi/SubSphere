name: SBS CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  #=================================================================
  # JOB 1: BACKEND PIPELINE
  #=================================================================
  backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔍 Check Backend Exists
        id: backend-check
        run: |
          if [ -d "backend" ] && [ "$(ls -A backend 2>/dev/null)" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Backend directory found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Backend directory not found - skipping"
          fi
      
      - name: 🐍 Set up Python 3.13
        if: steps.backend-check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: 📦 Cache Dependencies
        if: steps.backend-check.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
      
      # STAGE 1: BUILD
      - name: 📦 Install Dependencies
        if: steps.backend-check.outputs.exists == 'true'
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
      
      # STAGE 2: TEST
      - name: 🧪 Run Tests
        if: steps.backend-check.outputs.exists == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          pytest tests/unit/ -v
          pytest tests/integration/ -v
      
      # STAGE 3: COVERAGE (≥75%)
      - name: 📊 Coverage Report
        if: steps.backend-check.outputs.exists == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          pytest tests/ --cov=src --cov-report=html --cov-report=term --cov-fail-under=75
      
      # STAGE 4: LINT (≥7.5/10)
      - name: 🔍 Code Quality
        if: steps.backend-check.outputs.exists == 'true'
        run: |
          cd backend
          pylint src/ --fail-under=7.5 --output-format=text --reports=y | tee pylint-report.txt
      
      # STAGE 5: SECURITY
      - name: 🛡️ Security Scan
        if: steps.backend-check.outputs.exists == 'true'
        run: |
          cd backend
          bandit -r src/ -f json -o bandit-report.json
          safety check --output json > safety-report.json || true
      
      # STAGE 6: DEPLOYMENT ARTIFACT
      - name: 📦 Create Backend Artifact
        if: steps.backend-check.outputs.exists == 'true'
        run: |
          mkdir -p artifact/backend
          cp -r backend/src artifact/backend/
          cp backend/requirements.txt artifact/backend/
          cp -r backend/htmlcov artifact/coverage-backend/
          cp backend/pylint-report.txt artifact/
          cp backend/bandit-report.json artifact/
          cp backend/safety-report.json artifact/
          
          echo "Build: $(date)" > artifact/BACKEND_BUILD.txt
          echo "Coverage: ≥75%" >> artifact/BACKEND_BUILD.txt
          echo "Lint: ≥7.5/10" >> artifact/BACKEND_BUILD.txt
          echo "Commit: ${{ github.sha }}" >> artifact/BACKEND_BUILD.txt
      
      - name: 📤 Upload Backend Artifact
        if: steps.backend-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifact
          path: artifact/
          retention-days: 90

  #=================================================================
  # JOB 2: FRONTEND PIPELINE
  #=================================================================
  frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔍 Check Frontend Exists
        id: frontend-check
        run: |
          if [ -d "frontend" ] && [ "$(ls -A frontend 2>/dev/null)" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Frontend directory found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Frontend directory not found - skipping"
          fi
      
      - name: 🟢 Set up Node.js
        if: steps.frontend-check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # STAGE 1: BUILD
      - name: 📦 Install Dependencies
        if: steps.frontend-check.outputs.exists == 'true'
        run: |
          cd frontend
          npm ci
      
      # STAGE 2: LINT
      - name: 🔍 Code Quality
        if: steps.frontend-check.outputs.exists == 'true'
        run: |
          cd frontend
          npm run lint
      
      # STAGE 3: TEST
      - name: 🧪 Run Tests
        if: steps.frontend-check.outputs.exists == 'true'
        run: |
          cd frontend
          npm test -- --coverage --watchAll=false
      
      # STAGE 4: BUILD PRODUCTION
      - name: 🏗️ Build Production
        if: steps.frontend-check.outputs.exists == 'true'
        run: |
          cd frontend
          npm run build
      
      # STAGE 5: SECURITY
      - name: 🛡️ Security Audit
        if: steps.frontend-check.outputs.exists == 'true'
        run: |
          cd frontend
          npm audit --audit-level=moderate || echo "⚠️ Vulnerabilities found"
      
      # STAGE 6: DEPLOYMENT ARTIFACT
      - name: 📦 Create Frontend Artifact
        if: steps.frontend-check.outputs.exists == 'true'
        run: |
          mkdir -p artifact/frontend
          cp -r frontend/build artifact/frontend/
          cp -r frontend/coverage artifact/coverage-frontend/
          cp frontend/package.json artifact/frontend/
          
          echo "Build: $(date)" > artifact/FRONTEND_BUILD.txt
          echo "Tests: Passed" >> artifact/FRONTEND_BUILD.txt
          echo "ESLint: Passed" >> artifact/FRONTEND_BUILD.txt
          echo "Commit: ${{ github.sha }}" >> artifact/FRONTEND_BUILD.txt
      
      - name: 📤 Upload Frontend Artifact
        if: steps.frontend-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifact
          path: artifact/
          retention-days: 90

  #=================================================================
  # JOB 3: PIPELINE SUMMARY
  #=================================================================
  summary:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always() && (needs.backend.result != 'cancelled' || needs.frontend.result != 'cancelled')
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 📥 Download Backend Artifact
        if: needs.backend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: backend-artifact
          path: deployment/backend/
        continue-on-error: true
      
      - name: 📥 Download Frontend Artifact
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: frontend-artifact
          path: deployment/frontend/
        continue-on-error: true
      
      - name: 📦 Create Final Deployment Package
        id: create-package
        run: |
          mkdir -p deployment
          
          # Create comprehensive build info
          cat > deployment/BUILD_INFO.txt << EOF
          ================================================
          SBS Deployment Artifact
          ================================================
          Build Date: $(date)
          Commit SHA: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Run Number: ${{ github.run_number }}
          Triggered By: ${{ github.actor }}
          Event: ${{ github.event_name }}
          ================================================
          Pipeline Results:
          Backend:  ${{ needs.backend.result }}
          Frontend: ${{ needs.frontend.result }}
          ================================================
          Quality Gates:
          - Backend Coverage: ≥75%
          - Backend Lint: ≥7.5/10
          - Frontend Tests: Passed
          - Frontend ESLint: Passed
          ================================================
          EOF
          
          # Create deployment zip if files exist
          cd deployment
          if [ "$(ls -A)" ]; then
            zip -r ../sbs-deployment-${{ github.run_number }}.zip .
            echo "artifact-created=true" >> $GITHUB_OUTPUT
          else
            echo "artifact-created=false" >> $GITHUB_OUTPUT
            echo "⚠️ No files to package"
          fi
      
      - name: 📤 Upload Final Deployment Artifact
        if: steps.create-package.outputs.artifact-created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sbs-deployment-${{ github.run_number }}
          path: sbs-deployment-${{ github.run_number }}.zip
          retention-days: 90
      
      - name: 🎉 Pipeline Summary
        run: |
          echo "================================================"
          echo "         CI/CD Pipeline Summary"
          echo "================================================"
          echo "Backend:  ${{ needs.backend.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "================================================"
          echo "Run #${{ github.run_number }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "================================================"
          
          BACKEND_STATUS="${{ needs.backend.result }}"
          FRONTEND_STATUS="${{ needs.frontend.result }}"
          
          if [ "$BACKEND_STATUS" == "success" ] && [ "$FRONTEND_STATUS" == "success" ]; then
            echo "✅ ALL PIPELINES PASSED"
            exit 0
          elif [ "$BACKEND_STATUS" == "success" ] || [ "$FRONTEND_STATUS" == "success" ]; then
            echo "⚠️ PARTIAL SUCCESS"
            if [ "$BACKEND_STATUS" != "success" ]; then
              echo "❌ Backend failed or skipped"
            fi
            if [ "$FRONTEND_STATUS" != "success" ]; then
              echo "❌ Frontend failed or skipped"
            fi
            exit 0
          else
            echo "❌ ALL PIPELINES FAILED"
            exit 1
          fi
