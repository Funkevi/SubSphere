name: SBS Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  #=================================================================
  # JOB 1: DETECT PROJECT STRUCTURE
  #=================================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend-exists: ${{ steps.check-dirs.outputs.backend-exists }}
      frontend-exists: ${{ steps.check-dirs.outputs.frontend-exists }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔍 Check Directory Structure
        id: check-dirs
        run: |
          if [ -d "backend" ]; then
            echo "backend-exists=true" >> $GITHUB_OUTPUT
            echo "✅ Backend directory found"
          else
            echo "backend-exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Backend directory not found"
          fi
          
          if [ -d "frontend" ]; then
            echo "frontend-exists=true" >> $GITHUB_OUTPUT
            echo "✅ Frontend directory found"
          else
            echo "frontend-exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Frontend directory not found"
          fi

  #=================================================================
  # JOB 2: BACKEND CI/CD PIPELINE
  #=================================================================
  backend-pipeline:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-exists == 'true'
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: 📦 Cache Python Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      #=== STAGE 1: BUILD ===
      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      #=== STAGE 2: TEST ===
      - name: 🧪 Run Unit Tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          pytest tests/unit/ -v --tb=short
      
      - name: 🔗 Run Integration Tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          pytest tests/integration/ -v --tb=short
      
      #=== STAGE 3: COVERAGE ===
      - name: 📊 Generate Coverage Report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          pytest tests/ --cov=src --cov-report=html --cov-report=term --cov-report=xml --cov-fail-under=75
      
      - name: 💾 Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.run_number }}
          path: backend/htmlcov/
          retention-days: 30
      
      #=== STAGE 4: LINT ===
      - name: 🔍 Run Pylint
        run: |
          cd backend
          pylint src/ --fail-under=7.5 --output-format=text --reports=y | tee pylint-report.txt
      
      - name: 💾 Upload Backend Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-${{ github.run_number }}
          path: backend/pylint-report.txt
          retention-days: 30
      
      #=== STAGE 5: SECURITY ===
      - name: 🛡️ Run Bandit Security Scan
        run: |
          cd backend
          bandit -r src/ -f json -o bandit-report.json
      
      - name: 🔒 Check Dependency Vulnerabilities
        run: |
          cd backend
          safety check --output json > safety-report.json || true
      
      - name: 💾 Upload Backend Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-${{ github.run_number }}
          path: |
            backend/bandit-report.json
            backend/safety-report.json
          retention-days: 30
      
      - name: ✅ Backend Pipeline Complete
        run: echo "✅ Backend CI/CD completed successfully"

  #=================================================================
  # JOB 3: FRONTEND CI/CD PIPELINE
  #=================================================================
  frontend-pipeline:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-exists == 'true'
    
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🟢 Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      #=== STAGE 1: BUILD ===
      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
      
      #=== STAGE 2: LINT ===
      - name: 🔍 Run ESLint
        run: |
          cd frontend
          npm run lint
      
      #=== STAGE 3: TEST ===
      - name: 🧪 Run Frontend Tests
        run: |
          cd frontend
          npm test -- --coverage --watchAll=false
      
      - name: 💾 Upload Frontend Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ matrix.node-version }}-${{ github.run_number }}
          path: frontend/coverage/
          retention-days: 30
      
      #=== STAGE 4: BUILD PRODUCTION ===
      - name: 🏗️ Build Frontend for Production
        run: |
          cd frontend
          npm run build
      
      - name: 💾 Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ matrix.node-version }}-${{ github.run_number }}
          path: frontend/build/
          retention-days: 30
      
      #=== STAGE 5: SECURITY ===
      - name: 🔒 Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=moderate || echo "⚠️ Vulnerabilities found"
      
      - name: ✅ Frontend Pipeline Complete
        run: echo "✅ Frontend CI/CD completed successfully"

  #=================================================================
  # JOB 4: CREATE UNIFIED DEPLOYMENT ARTIFACT
  #=================================================================
  create-deployment-artifact:
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-pipeline, frontend-pipeline]
    if: always() && (needs.backend-pipeline.result == 'success' || needs.frontend-pipeline.result == 'success')
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 📦 Download Backend Artifacts
        if: needs.detect-changes.outputs.backend-exists == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: artifacts/backend/
      
      - name: 📦 Download Frontend Artifacts
        if: needs.detect-changes.outputs.frontend-exists == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: frontend-*
          path: artifacts/frontend/
      
      - name: 📦 Create Unified Deployment Package
        run: |
          mkdir -p deployment-artifact
          
          # Package backend if exists
          if [ -d "backend" ]; then
            echo "📁 Packaging backend..."
            mkdir -p deployment-artifact/backend
            cp -r backend/src/ deployment-artifact/backend/
            cp backend/requirements.txt deployment-artifact/backend/
            
            # Copy backend artifacts
            cp -r artifacts/backend/backend-coverage-*/htmlcov deployment-artifact/coverage-backend/ || true
            cp artifacts/backend/backend-lint-*/pylint-report.txt deployment-artifact/ || true
            cp artifacts/backend/backend-security-*/*.json deployment-artifact/ || true
            
            echo "✅ Backend packaged"
          fi
          
          # Package frontend if exists
          if [ -d "frontend" ]; then
            echo "📁 Packaging frontend..."
            mkdir -p deployment-artifact/frontend
            cp -r frontend/src/ deployment-artifact/frontend/src/ || true
            cp frontend/package.json deployment-artifact/frontend/ || true
            
            # Copy frontend build (from Node 20.x build)
            cp -r artifacts/frontend/frontend-build-20.x-*/build deployment-artifact/frontend/ || true
            cp -r artifacts/frontend/frontend-coverage-20.x-*/coverage deployment-artifact/coverage-frontend/ || true
            
            echo "✅ Frontend packaged"
          fi
          
          # Create README
          cp README.md deployment-artifact/ || true
          
          # Create metadata
          cat > deployment-artifact/BUILD_INFO.txt << EOF
          ================================================
          SBS Deployment Artifact
          ================================================
          Build Date: $(date)
          Commit SHA: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Run Number: ${{ github.run_number }}
          Backend Included: ${{ needs.detect-changes.outputs.backend-exists }}
          Frontend Included: ${{ needs.detect-changes.outputs.frontend-exists }}
          Backend Status: ${{ needs.backend-pipeline.result }}
          Frontend Status: ${{ needs.frontend-pipeline.result }}
          ================================================
          Quality Gates:
          - Backend Coverage: ≥75%
          - Backend Lint: ≥7.5/10
          - Frontend Tests: Passed
          - Frontend ESLint: Passed
          ================================================
          EOF
          
          # Create archive
          cd deployment-artifact
          zip -r ../sbs-fullstack-deployment-${{ github.run_number }}.zip .
      
      - name: 📤 Upload Unified Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbs-deployment-${{ github.run_number }}
          path: sbs-fullstack-deployment-${{ github.run_number }}.zip
          retention-days: 90
      
      - name: ✅ Deployment Artifact Created
        run: echo "✅ Unified deployment artifact created successfully"

  #=================================================================
  # JOB 5: PIPELINE SUMMARY
  #=================================================================
  pipeline-summary:
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-pipeline, frontend-pipeline, create-deployment-artifact]
    if: always()
    
    steps:
      - name: 🎉 Pipeline Summary
        run: |
          echo "================================================"
          echo "   📊 SBS CI/CD Pipeline Summary"
          echo "================================================"
          echo "Backend Pipeline:  ${{ needs.backend-pipeline.result }}"
          echo "Frontend Pipeline: ${{ needs.frontend-pipeline.result }}"
          echo "Deployment:        ${{ needs.create-deployment-artifact.result }}"
          echo "================================================"
          echo "Backend Present:   ${{ needs.detect-changes.outputs.backend-exists }}"
          echo "Frontend Present:  ${{ needs.detect-changes.outputs.frontend-exists }}"
          echo "================================================"
          echo "Run Number: ${{ github.run_number }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch:     ${{ github.ref_name }}"
          echo "Triggered:  ${{ github.event_name }}"
          echo "Actor:      ${{ github.actor }}"
          echo "================================================"
          
          # Print final status
          if [ "${{ needs.backend-pipeline.result }}" == "success" ] && [ "${{ needs.frontend-pipeline.result }}" == "success" ]; then
            echo "✅ ALL PIPELINES PASSED"
          elif [ "${{ needs.backend-pipeline.result }}" == "success" ] || [ "${{ needs.frontend-pipeline.result }}" == "success" ]; then
            echo "⚠️ PARTIAL SUCCESS"
          else
            echo "❌ PIPELINE FAILED"
          fi
