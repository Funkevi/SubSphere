name: SBS Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      #=== STAGE 1: BUILD ===
      - name: 📦 Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      #=== STAGE 2: TEST (MUST PASS) ===
      - name: 🧪 Run Unit Tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          pytest tests/unit/ -v --tb=short
          # ❌ NO || echo - FAILS pipeline if tests fail
      
      - name: 🔗 Run Integration Tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          pytest tests/integration/ -v --tb=short
          # ❌ NO || echo
      
      #=== STAGE 3: COVERAGE (≥75% REQUIRED) ===
      - name: 📊 Generate Coverage Report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          pytest tests/ --cov=src --cov-report=html --cov-report=term --cov-report=xml --cov-fail-under=75
          # ❌ NO || echo - FAILS if coverage < 75%
      
      - name: 💾 Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/
      
      #=== STAGE 4: LINT (≥7.5 REQUIRED) ===
      - name: 🔍 Run Pylint
        run: |
          cd backend
          pylint src/ --fail-under=7.5 --output-format=text --reports=y | tee pylint-report.txt
          # ❌ NO || true - FAILS if score < 7.5
      
      - name: 💾 Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: backend/pylint-report.txt
      
      #=== STAGE 5: SECURITY ===
      - name: 🛡️ Run Security Scans
        run: |
          cd backend
          bandit -r src/ -f json -o bandit-report.json
          safety check --output json > safety-report.json || true
          # Security can warn but document issues
      
      - name: 💾 Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json
      
      #=== STAGE 6: DEPLOYMENT ARTIFACT ===
      - name: 📦 Create Deployment Package
        if: success()  # Only if all above stages pass
        run: |
          mkdir -p deployment-artifact/backend
          
          # Copy source code
          cp -r backend/src/ deployment-artifact/backend/
          cp backend/requirements.txt deployment-artifact/backend/
          
          # Copy reports
          cp -r backend/htmlcov/ deployment-artifact/coverage-report/
          cp backend/pylint-report.txt deployment-artifact/
          cp backend/bandit-report.json deployment-artifact/
          cp backend/safety-report.json deployment-artifact/
          
          # Copy README
          cp README.md deployment-artifact/
          
          # Create metadata
          echo "Build Date: $(date)" > deployment-artifact/BUILD_INFO.txt
          echo "Commit: ${{ github.sha }}" >> deployment-artifact/BUILD_INFO.txt
          echo "Coverage: ≥75%" >> deployment-artifact/BUILD_INFO.txt
          echo "Lint Score: ≥7.5" >> deployment-artifact/BUILD_INFO.txt
          
          # Create zip
          cd deployment-artifact
          zip -r ../sbs-deployment-${{ github.run_number }}.zip .
      
      - name: 📤 Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbs-deployment-${{ github.run_number }}
          path: sbs-deployment-${{ github.run_number }}.zip
          retention-days: 90
