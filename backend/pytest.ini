[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Pytest options
addopts =
    --strict-markers
    --tb=short
    -v
    --disable-warnings

# Asyncio mode
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Python path (allows imports without sys.path hacks)
pythonpath = .

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
